name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (tag/branch) to build from"
        required: false
        type: string
        default: "main"

jobs:
  build:
    name: Build ${{ matrix.build_target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_target:
          - chromium
          - firefox
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build ${{ matrix.build_target }}
        run: pnpm run build:${{ matrix.build_target }}
        env:
          GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
          UNSPLASH_API_KEY: ${{ secrets.UNSPLASH_API_KEY }}
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}

      - name: Package extension
        run: |
          if [ "${{ matrix.build_target }}" = "chromium" ]; then
            openssl genrsa -out key.pem 2048
            if command -v google-chrome >/dev/null 2>&1; then
              google-chrome --pack-extension=dist/chromium --pack-extension-key=key.pem
              mv dist/chromium.crx tabliss-chromium.crx
            elif command -v chromium >/dev/null 2>&1; then
              chromium --pack-extension=dist/chromium --pack-extension-key=key.pem
              mv dist/chromium.crx tabliss-chromium.crx
            elif command -v chromium-browser >/dev/null 2>&1; then
              chromium-browser --pack-extension=dist/chromium --pack-extension-key=key.pem
              mv dist/chromium.crx tabliss-chromium.crx
            else
              npx --yes crx pack dist/chromium -p key.pem -o tabliss-chromium.crx
            fi
          elif [ "${{ matrix.build_target }}" = "firefox" ]; then
            cd dist/firefox
            zip -r ../../tabliss-firefox.xpi ./*
            cd ../..
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: tabliss-${{ matrix.build_target }}-pkg
          path: |
            tabliss-${{ matrix.build_target }}.crx
            tabliss-${{ matrix.build_target }}.xpi
          if-no-files-found: ignore

  create-release:
    needs: [build]
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: tabliss-*-pkg
          merge-multiple: true

      - name: Determine release tag
        id: version
        run: |
          REF="${{ inputs.ref }}"
          if [ -z "$REF" ] || [ "$REF" = "main" ]; then
            REF="${{ github.ref_name }}"
          fi
          if [ "$REF" = "main" ] || [ -z "$REF" ]; then
            PKG_VERSION=$(node -p "require('./package.json').version")
            TAG_NAME="v$PKG_VERSION"
            RELEASE_NAME="Version $PKG_VERSION"
          else
            TAG_NAME="$REF"
            VERSION=${REF#v}
            RELEASE_NAME="Version $VERSION"
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "release_name=$RELEASE_NAME" >> $GITHUB_OUTPUT

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.release_name }}
          tag_name: ${{ steps.version.outputs.tag_name }}
          files: |
            tabliss-chromium.crx
            tabliss-firefox.xpi
          draft: false
          prerelease: false
          generate_release_notes: true


name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (tag/branch) to build from"
        required: false
        type: string
        default: "main"

jobs:
  build:
    name: Build ${{ matrix.build_target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_target:
          - chromium
          - firefox
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build ${{ matrix.build_target }}
        run: pnpm run build:${{ matrix.build_target }}
        env:
          GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
          UNSPLASH_API_KEY: ${{ secrets.UNSPLASH_API_KEY }}
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}

      - name: Package extension
        run: |
          cd dist/${{ matrix.build_target }}
          zip -r ../../tabliss-${{ matrix.build_target }}.zip ./*
          cd ../..

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: tabliss-${{ matrix.build_target }}-zip
          path: tabliss-${{ matrix.build_target }}.zip

  create-release:
    needs: [build]
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: tabliss-*-zip
          merge-multiple: true

      - name: Determine release tag
        id: version
        run: |
          REF="${{ inputs.ref }}"
          if [ -z "$REF" ] || [ "$REF" = "main" ]; then
            REF="${{ github.ref_name }}"
          fi
          if [ "$REF" = "main" ] || [ -z "$REF" ]; then
            PKG_VERSION=$(node -p "require('./package.json').version")
            TAG_NAME="v$PKG_VERSION"
            RELEASE_NAME="Version $PKG_VERSION"
          else
            TAG_NAME="$REF"
            VERSION=${REF#v}
            RELEASE_NAME="Version $VERSION"
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "release_name=$RELEASE_NAME" >> $GITHUB_OUTPUT

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.release_name }}
          tag_name: ${{ steps.version.outputs.tag_name }}
          files: |
            tabliss-chromium.zip
            tabliss-firefox.zip
          draft: false
          prerelease: false
          generate_release_notes: true
